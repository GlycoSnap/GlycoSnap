services:
  model:
    build: ./Model
    container_name: glycosnap_flask
    volumes:
      - ./Model:/app
      - ./Model/credentials:/app/credentials:ro  # Correct credentials mount
      - C:/GlycoSnap/model:/app/model  # Bind model folder inside /app
    ports:
      - "5000:5000"
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/app/credentials/credentials.json
      - FLASK_APP=app.py
      - DOCKER_ENV=true  # Add this for path detection
    command: ["flask", "run", "--host=0.0.0.0", "--port=5000"]
